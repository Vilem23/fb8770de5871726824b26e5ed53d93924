<script>
// iOS home-screen apps with a translucent status bar report a viewport that is
// one status bar shorter than the screen, leaving a white strip at the bottom.
(function () {
  if (!(navigator.standalone || matchMedia('(display-mode: standalone)').matches)) return;
  var fit = function () {
    var h = innerHeight > innerWidth ? Math.max(innerHeight, screen.height) : innerHeight;
    document.documentElement.style.setProperty('--app-h', h + 'px');
  };
  fit(); addEventListener('resize', fit); addEventListener('orientationchange', fit);
})();
</script>
</head>
<body>
<div id="stage">
  <div id="phone">
    <div id="screen"></div>
    <div id="overlay"></div>
    <div id="toast"></div>
  </div>
</div>
